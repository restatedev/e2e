name: CI

permissions:
  contents: read
  checks: write
  pull-requests: write

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "12 0 * * *" # 00:12am UTC daily

jobs:
  build-and-test:
    name: Build and test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        java: [ 25 ]
    steps:
      - uses: actions/checkout@v4.4.0
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4.9.1
        with:
          java-version: ${{ matrix.java }}
          distribution: 'adopt'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.4.3

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4.4.3

      - name: Run
        run: ./gradlew :e2e-tests:run
        env:
          TEST_REPORT_DIR: test-report

      # Upload logs and publish test result
      - uses: actions/upload-artifact@v4.6.2
        if: always() # Make sure this is run even when test fails
        with:
          name: e2e-test-report
          path: e2e-tests/test-report
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2.25.0
        if: always()
        with:
          files: |
            e2e-tests/test-report/*/*.xml

  event_file:
    name: "Event File"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Upload
        uses: actions/upload-artifact@v4.6.2
        with:
          name: Event File
          path: ${{ github.event_path }}
